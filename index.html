<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071C39">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Haus Prime Gutter's official links: website, project gallery, WhatsApp, Facebook, Instagram, TikTok, and LinkedIn. Gutter services in NJ, PA, and NY.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Haus Prime Gutter | Official Links">
  <meta property="og:description" content="Explore our gutter projects, get in touch, and follow Haus Prime on social media.">
  <meta property="og:url" content="https://links.hausprimegutter.com/">
  <meta property="og:image" content="https://links.hausprimegutter.com/assets/haus-prime-logo.png">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://links.hausprimegutter.com/">
  <link rel="icon" type="image/png" href="./assets/haus-prime-logo.png">
  <title>Haus Prime Gutter | Official Links</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #071C39;
      --pink: #EF3A61;
      --white: #FFFFFF;
      --muted: #C3D0E0;
      --border: rgba(199, 214, 233, .24);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--navy); }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--white);
      background: radial-gradient(ellipse at 50% 0%, #1C4267 0, #071C39 49%, #041127 100%);
    }
    .page {
      width: min(100% - 36px, 510px);
      margin: 0 auto;
      padding: 44px 0 34px;
      text-align: center;
    }
    .brand-frame {
      width: 218px;
      max-width: 75vw;
      aspect-ratio: 610 / 438;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 22px;
      padding: 11px 13px;
      border-radius: 24px;
      background: #FFFFFF;
      box-shadow: 0 16px 45px rgba(0, 0, 0, .25);
    }
    .brand-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      /* Exact PNG provided by the Haus Prime team, with no edits or redraw. */
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 5.6vw, 38px);
      font-weight: 850;
      letter-spacing: -1.4px;
      line-height: 1.1;
    }
    h1 strong { color: var(--pink); }
    .intro {
      max-width: 410px;
      margin: 14px auto 11px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .region {
      margin: 0 auto 29px;
      color: #E3EAF4;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 1.85px;
      line-height: 1.6;
    }
    .links {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      text-align: left;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
      min-height: 72px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(255, 255, 255, .065);
      color: var(--white);
      text-decoration: none;
      transition: transform .17s ease, background .17s ease, border-color .17s ease, box-shadow .17s ease;
    }
    .link:hover, .link:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, .13);
      border-color: rgba(255, 255, 255, .6);
      box-shadow: 0 8px 25px rgba(0, 0, 0, .18);
      outline: none;
    }
    .link:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
    .link.featured {
      background: linear-gradient(130deg, #F24870, #E92F5B);
      border-color: transparent;
      box-shadow: 0 10px 25px rgba(239, 58, 97, .22);
    }
    .link.featured:hover, .link.featured:focus-visible {
      background: linear-gradient(130deg, #FF6184, #EE3E67);
    }
    .link-icon {
      flex: 0 0 39px;
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: rgba(255, 255, 255, .13);
    }
    .link-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .link-icon .filled { fill: currentColor; stroke: none; }
    .link-copy { min-width: 0; flex: 1; }
    .link-title { display: block; font-size: 15px; font-weight: 750; line-height: 1.3; overflow-wrap: anywhere; }
    .link-description { display: block; margin-top: 5px; color: #C3D1E3; font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
    .featured .link-description { color: #FFFFFF; opacity: .94; }
    .link-arrow { flex: 0 0 auto; margin-left: 1px; font-size: 21px; font-weight: 400; line-height: 1; opacity: .82; }
    footer { margin: 34px auto 0; color: #B5C5D9; font-size: 11px; line-height: 1.9; }
    footer a { color: #FFFFFF; text-decoration-color: rgba(255, 255, 255, .55); text-underline-offset: 3px; }
    .icon-library { position: absolute; width: 0; height: 0; overflow: hidden; }
    /* Adding new links does not require changing the markup or these styles. */
    @media (min-width: 780px) {
      .page.many-links { width: min(100% - 48px, 790px); }
      .many-links .links { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .many-links .link.featured { grid-column: 1 / -1; }
    }
    @media (max-width: 360px) {
      .page { width: min(100% - 24px, 510px); padding-top: 30px; }
      .brand-frame { width: 192px; margin-bottom: 20px; }
      .region { letter-spacing: 1.3px; }
      .link { gap: 11px; padding: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
      .link:hover { transform: none; }
    }
  </style>
</head>
<body>
  <!-- Inline SVG icon set: no paid API, icon files or third-party icon CDN needed. -->
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9M12 3c-3 3-4 6-4 9s1 6 4 9"/></symbol>
    <symbol id="icon-gallery" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m4 17 5-5 3.5 3.5 2.7-2.7L21 18"/></symbol>
    <symbol id="icon-whatsapp" viewBox="0 0 24 24"><path d="M20.6 11.6A8.6 8.6 0 0 1 8 19.2L3 21l1.7-5A8.6 8.6 0 1 1 20.6 11.6Z"/><path d="M9 8.4c-.5 0-.8.4-.8.9 0 2.3 3.3 5.6 5.6 5.6.5 0 .9-.3.9-.8l-.2-1.1-1.6-.6-1 1a7 7 0 0 1-2.5-2.5l1-1-.6-1.6L9 8.4Z"/></symbol>
    <symbol id="icon-facebook" viewBox="0 0 24 24"><path class="filled" d="M14.8 21v-7.6h2.6l.4-3.3h-3V8.1c0-1 .3-1.7 1.7-1.7h1.6V3.5a23 23 0 0 0-2.4-.1c-2.7 0-4.5 1.6-4.5 4.5v2.2H8.5v3.3h2.7V21h3.6Z"/></symbol>
    <symbol id="icon-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.6" cy="6.5" r=".75" class="filled"/></symbol>
    <symbol id="icon-tiktok" viewBox="0 0 24 24"><path class="filled" d="M16.3 2.2c.4 2.3 1.8 3.7 4.1 3.9v3.5c-1.7 0-3.2-.5-4.2-1.4v7.1a6.2 6.2 0 1 1-6.2-6.2c.4 0 .8 0 1.3.1V13a3 3 0 0 0-1.3-.3 2.7 2.7 0 1 0 2.7 2.7V2.2h3.6Z"/></symbol>
    <symbol id="icon-linkedin" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="7.2" cy="7.2" r="1.1" class="filled"/><path d="M7.2 11v6.8M11.4 17.8V11h3.2v.9c.5-.7 1.3-1.1 2.2-1.1 1.7 0 2.3 1.1 2.3 2.8v4.2M14.6 11.9v5.9"/></symbol>
    <symbol id="icon-youtube" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3V9Z"/></symbol>
    <symbol id="icon-email" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m2 7 10 7 10-7"/></symbol>
    <symbol id="icon-phone" viewBox="0 0 24 24"><path d="M8 3 5.8 2A2 2 0 0 0 3.3 3C2 5 4.1 10 8 14s8.9 6.2 11 4.7a2 2 0 0 0 1-2.5L19 14a2 2 0 0 0-2.3-.8l-2 .7A16 16 0 0 1 9.5 8.7l.7-2A2 2 0 0 0 9.4 4Z"/></symbol>
    <symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 2.5 3 6.2 6.8 1-4.9 4.7 1.2 6.7-6.1-3.2-6.1 3.2 1.2-6.7-4.9-4.7 6.8-1Z"/></symbol>
    <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l2.1-2.1a5 5 0 0 0-7.1-7.1l-1.2 1.2"/><path d="M14 11a5 5 0 0 0-7 0l-2.1 2.1a5 5 0 0 0 7.1 7.1l1.2-1.2"/></symbol>
  </svg>

  <main class="page" id="page">
    <div class="brand-frame">
      <img class="brand-image" src="./assets/haus-prime-logo.png" alt="Official Haus Prime Gutter logo" width="610" height="409" decoding="async" fetchpriority="high">
    </div>
    <h1>HAUS <strong>PRIME</strong></h1>
    <p class="intro">Seamless gutters. Reliable protection.<br>Installation · Cleaning · Gutter Guards · Repairs</p>
    <p class="region">NEW JERSEY · PENNSYLVANIA · NEW YORK</p>

    <nav class="links" id="links" aria-label="Official Haus Prime links"></nav>
    <noscript><p><a href="https://www.hausprimegutter.com">Visit Haus Prime Gutter</a> or <a href="https://wa.me/15513885481">chat with us on WhatsApp</a>.</p></noscript>

    <footer>
      © <span id="year">2026</span> Haus Prime Gutter<br>
      <a href="https://www.hausprimegutter.com">Official website</a>
    </footer>
  </main>

  <script>
    /* ======================================================================
       HOW TO ADD, REMOVE OR REORDER LINKS
       -----------------------------------
       Edit ONLY the LINKS list below. Every item creates one new button.
       - title:    Button name
       - detail:   Small subtitle below the name (optional)
       - url:      Destination, including https:// (required)
       - icon:     globe | gallery | whatsapp | facebook | instagram |
                   tiktok | linkedin | youtube | email | phone | star | link
       - featured: true  highlights a button in pink (optional)
       - enabled:  false hides a button without deleting it (optional)

       The layout automatically supports any number of links. Starting at
       9+ links, desktop uses two columns; phones always use one column.
       ====================================================================== */
    const LINKS = [
      {
        title: "Our Website",
        detail: "Services, information & free estimates",
        url: "https://www.hausprimegutter.com",
        icon: "globe"
      },
      {
        title: "Project Gallery",
        detail: "Browse our completed gutter projects",
        url: "https://hausprime.46graus.com/gallery/",
        icon: "gallery"
      },
      {
        title: "WhatsApp",
        detail: "Message our team directly",
        url: "https://wa.me/15513885481",
        icon: "whatsapp",
        featured: true
      },
      {
        title: "Facebook",
        detail: "Follow us on Facebook",
        url: "https://www.facebook.com/hausprimegutters/",
        icon: "facebook"
      },
      {
        title: "Instagram",
        detail: "@hausprimegutter",
        url: "https://www.instagram.com/hausprimegutter/",
        icon: "instagram"
      },
      {
        title: "TikTok",
        detail: "@hausprimegutters",
        url: "https://www.tiktok.com/@hausprimegutters",
        icon: "tiktok"
      },
      {
        title: "LinkedIn",
        detail: "Connect with Haus Prime",
        url: "https://www.linkedin.com/in/hausprimegutters/",
        icon: "linkedin"
      }
      // To add another button, add a comma after the item above and paste:
      // { title: "YouTube", detail: "See our videos", url: "https://...", icon: "youtube" }
    ];

    const ICONS = new Set([
      "globe", "gallery", "whatsapp", "facebook", "instagram", "tiktok",
      "linkedin", "youtube", "email", "phone", "star", "link"
    ]);

    function safeDestination(value) {
      if (typeof value !== "string") return null;
      const candidate = value.trim();
      if (/^tel:\+?[0-9 ()-]+$/i.test(candidate)) return candidate;
      if (/^mailto:[^\s@]+@[^\s@]+\.[^\s@]+$/i.test(candidate)) return candidate;
      try {
        const parsed = new URL(candidate);
        if (parsed.protocol === "https:" || parsed.protocol === "http:") return parsed.href;
      } catch (error) { /* An invalid future link is skipped, not rendered. */ }
      return null;
    }

    function renderLinks() {
      const nav = document.getElementById("links");
      const page = document.getElementById("page");
      const activeLinks = LINKS.filter(item => item && item.enabled !== false &&
        typeof item.title === "string" && item.title.trim() && safeDestination(item.url));
      page.classList.toggle("many-links", activeLinks.length >= 9);
      nav.replaceChildren();
      const fragment = document.createDocumentFragment();

      activeLinks.forEach(item => {
        const href = safeDestination(item.url);
        const anchor = document.createElement("a");
        anchor.className = "link" + (item.featured === true ? " featured" : "");
        anchor.href = href;
        if (/^https?:/i.test(href)) {
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
        }

        const iconBox = document.createElement("span");
        iconBox.className = "link-icon";
        iconBox.setAttribute("aria-hidden", "true");
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
        use.setAttribute("href", "#icon-" + (ICONS.has(item.icon) ? item.icon : "link"));
        svg.appendChild(use);
        iconBox.appendChild(svg);

        const copy = document.createElement("span");
        copy.className = "link-copy";
        const title = document.createElement("span");
        title.className = "link-title";
        title.textContent = item.title;
        copy.appendChild(title);
        if (typeof item.detail === "string" && item.detail.trim()) {
          const detail = document.createElement("span");
          detail.className = "link-description";
          detail.textContent = item.detail;
          copy.appendChild(detail);
        }
        const arrow = document.createElement("span");
        arrow.className = "link-arrow";
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "↗";
        anchor.append(iconBox, copy, arrow);
        fragment.appendChild(anchor);
      });
      nav.appendChild(fragment);
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    renderLinks();
  </script>
</body>
</html>
